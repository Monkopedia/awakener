# Bound what one build may take of the machine.
#
# There is no gradle.properties by default, which means max workers = every core and a
# daemon heap that grows until it doesn't. That is survivable for one developer running one
# build. It is not survivable here: agents build from parallel git worktrees, and every :wm
# test spawns a headless sway and a foot. kaladin took two unlogged hard stops within nine
# hours of that pattern starting (2026-07-30/31), and froze again on 2026-11-02 with 22 JVMs
# up across the fleet (the figure fleet-build's header records).
#
# These lines bound ONE daemon — four workers, a 2g heap — and the test JVMs and
# compositors those workers fork. They do not bound how many daemons run at once, and no
# file in this repo can. What bounds that is host-side on kaladin, outside this repo:
#
#   - fleet-build (~/.local/bin) holds one of FLEET_BUILD_SLOTS (default 4) flock slots,
#     shared by every repo, for the life of the command it wraps. It caps concurrent
#     *wrapped commands*: a bare ./gradlew or an IDE sync bypasses it, a spotlessApply
#     costs the same slot as a full build, and the slot is freed when the client exits
#     while its daemon (and Kotlin daemon) stay resident.
#   - ~/.gradle/gradle.properties sets org.gradle.daemon.idletimeout to 15 minutes. That
#     file overrides this one, key for key.
#   - the jvm-reaper user timer (every 2 min) SIGTERMs Gradle/Kotlin daemons that used no
#     CPU over 30s, and only while MemAvailable is under 12000 MB. It never touches CPU
#     load or a busy daemon.
#
# Nothing bounds an unwrapped run, another repo's daemons sized larger than these, or an
# idle daemon's memory while MemAvailable is above the reaper's threshold. Measured 2026-11-22 at origin/main
# 9e80694: 19 worktrees, 16 cores, 64 GB. With fleet-build in place since 11-02, the 15s
# sampler (/var/log/kaladin-load.log, `pgrep -c java`) still peaked at 35 JVMs on
# 2026-11-08 23:31, and MemAvailable bottomed at 12.9 GB — just above the reaper's line,
# and its journal shows no termination since it was installed.
#
# So four slots of four workers is sixteen, one per core, *if* every repo's build is sized
# like this one. Change these numbers on measurement, not in either direction by default:
# too high costs the box, too low only a slower build.
org.gradle.workers.max=4
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
