# Bound what one build may take of the machine.
#
# There is no gradle.properties by default, which means max workers = every core and a
# daemon heap that grows until it doesn't. That is survivable for one developer running one
# build. It is not survivable here: agents work in parallel git worktrees, so several
# daemons run at once, each entitled to all 16 threads, each spawning a headless sway and a
# foot per :wm test. kaladin idled for 13 days and then took two unlogged hard stops within
# nine hours of that pattern starting — the failure modes that leave no log (a PSU rail
# under a load step, a hardware thermal trip) are the ones sustained all-core saturation
# causes.
#
# Four workers and a 2g heap leaves headroom for two concurrent agents plus the compositor
# processes their tests spawn. Raise it if the machine turns out to be innocent; the cost of
# being wrong in this direction is a slower build, and in the other direction it is the box.
org.gradle.workers.max=4
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
