name: build

on:
  push:
    branches: [main]
  pull_request:

# Cancelling a superseded run is right for a pull request and wrong for main.
#
# On a PR, a new push replaces the commit the in-flight run was measuring, so that run has
# nothing left to say and killing it is free. On main, every merge is a commit somebody may
# need to bisect to or revert to, and a commit with no run is not a known-good point.
#
# Sharing one group across main pushes loses runs two separate ways, and #73 names only the
# first: cancel-in-progress kills the run in flight, and *even with it off* GitHub keeps at
# most one pending run per group — "any existing pending job or workflow in the same
# concurrency group will be canceled and the new queued job or workflow will take its place".
# Three merges inside three minutes is exactly the shape that trips the second one, and that
# is the shape #73 was filed about. Scoping cancel-in-progress alone would not have saved
# 3d779d9; it would have been cancelled while pending instead of while running.
#
# Giving each main commit its own group is what stops both, because runs then never contend
# and every merge gets its own verdict. The expression on cancel-in-progress is redundant
# while the group is per-sha, and is kept anyway: it states the intent, and it still holds if
# the group is ever simplified back to the ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every third-party `uses:` below is pinned to a full commit SHA with the tag it resolved to in a
# trailing comment. A tag is not a pin — `@v4` is a mutable ref the publishing repository can move
# at any time, so it names a policy ("whatever they call v4 today"), not an artefact. The SHA names
# the artefact. The comment is what lets the next reader see which version it is without an API
# call, and it is a comment precisely because nothing enforces it: if the two ever disagree, the SHA
# is what runs.
#
# The cost, stated rather than discovered later: a SHA also freezes the deprecation warnings these
# actions emit ("Node.js 20 is deprecated", "setup-java v4 is deprecated"). Those used to clear
# themselves when the publisher moved the tag; now they clear when somebody bumps the SHA on
# purpose. That is the trade being made — drift you did not choose, for warnings you have to
# choose to clear — and it is the same trade the `spanreed-bus` pin makes with its version.
#
# The bound on all of this is that the token here is read-only. Every downloaded thing in this
# workflow — the actions, the Gradle distribution, the apt packages, the spanreed wheel — executes
# on the runner, so a compromised one runs arbitrary code with whatever credentials the job holds.
# `default_workflow_permissions: read` at the repository level is the reason that is "code execution
# on an ephemeral runner" rather than "code execution holding a write token", but a repository
# setting is invisible from the tree and one click from being widened. Declaring it here puts the
# bound in the diff, where a change to it has to be reviewed like anything else. The trigger is
# plain `pull_request`, never `pull_request_target`, so a fork's code never runs with repo
# credentials in the first place.
permissions:
  contents: read

jobs:
  # A red on this check means the code is red. Every step in it is compile, test, or a
  # prerequisite without which the tests cannot run at all; nothing in it can fail for a
  # reason with no bearing on whether the code works. Uploading the evidence used to live
  # here, and #57 is the run where it hit a symlink loop and reported the build as broken
  # while every test passed. That step now reports under its own name, below.
  build:
    runs-on: ubuntu-latest
    outputs:
      xml-upload: ${{ steps.upload-xml.outcome }}
      html-upload: ${{ steps.upload-html.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ⚠️ The pin rejects a wrong value and accepts a MISSING one. Measured on an isolated copy
      # of this wrapper, fresh GRADLE_USER_HOME each time — four states of the one line, and the
      # two gates in this job catch disjoint halves of them:
      #
      #   value            wrapper                                   this guard
      #   real             exit 0, unpacked                          pinned    (0)
      #   deleted          exit 0, DOWNLOADED AND RAN, unverified    UNPINNED  (1)  <- only here
      #   empty            exit 1, nothing unpacked                  UNPINNED  (1)
      #   64 zeroes        exit 1, nothing unpacked                  pinned    (0)  <- only there
      #
      # So `distributionSha256Sum` on its own does not fail closed: deleting the line restores the
      # pre-#101 behaviour and every build stays green with nothing verified. That is the same
      # failure this PR caught one level down, and deletion is the realistic accident — a merge
      # resolution across gradle-wrapper.properties, or the 9.5.1 -> 9.7.0 bump that has to
      # rewrite exactly this line. (`./gradlew wrapper --gradle-version` was expected to strip it
      # and does not; it preserves the value and drops only the comments. Checked, not assumed.)
      #
      # Nothing else here holds the property. wrapper-validation below reads the **jar** and never
      # opens gradle-wrapper.properties, and a Gradle task could not hold it either: by the time
      # any Gradle code runs, the unverified distribution has already been unpacked and executed.
      # Hence a shell check, first, before ./gradlew exists as an option.
      #
      # The matrix runs first and is not ceremony — it is the control that this guard can still
      # fail. It asserts a deleted line is rejected *and* that 64 zeroes are accepted, so a later
      # "improvement" that makes the guard judge correctness instead of presence collapses the two
      # gates into one and reddens here.
      - name: Check the distribution is pinned at all
        run: |
          set -eu
          .github/scripts/check-wrapper-pin-matrix.sh
          .github/scripts/check-wrapper-pin.sh

      # gradle-wrapper.jar is committed to this repository, and it is the code that downloads and
      # unpacks the distribution — so `distributionSha256Sum` in gradle-wrapper.properties is only
      # as good as the jar that reads it. This step compares the committed jar against Gradle's
      # published list of known-good wrapper jars. It has to run before anything invokes ./gradlew,
      # which is why it sits above setup-gradle rather than next to the build.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # ⚠️ Without this step `distributionSha256Sum` is a checksum CI never evaluates, and a
      # checksum nobody checks is indistinguishable from no checksum at all.
      #
      # Measured, not reasoned about. setup-gradle restores ~/.gradle/wrapper/dists from its own
      # cache entry, and that entry holds the **unpacked** distribution together with the wrapper's
      # `.ok` marker — so `Install` short-circuits and returns before it ever reaches
      # `verifyDownloadChecksum`. The key is derived from the distributionUrl and nothing else:
      # `gradle-wrapper-zips-v1-32a3a100d181ec75e824fde1164fcedd` was byte-identical across a run
      # with the real checksum and a run with it replaced by 64 zeroes, because the checksum is not
      # an input to it. Run 31297782597 on this branch is that second run, and it came back
      # **green** — a workflow carrying a deliberately wrong pin, verifying nothing, reporting
      # success. That is the exact shape of #100 and #89.
      #
      # Deleting the restored copy costs one download of a 130MB zip per build and buys the only
      # thing the checksum was added for: the wrapper takes the download path, hashes what it was
      # served, and aborts before unpacking if it disagrees. Run 31297924375 is the same zeroed
      # checksum with this step present, and it is **red**, at `Build and test`, on
      # "Verification of Gradle distribution failed!".
      #
      # It has to run *after* setup-gradle, because setup-gradle is what puts the directory there.
      #
      # And the `rm` cannot fail loudly on its own: if setup-gradle ever stops putting the
      # distribution at this path, the `rm` deletes nothing, exits 0, and the checksum goes back to
      # being inert with nothing saying so — a third way to be green and verify nothing, after
      # "no pin" and "wrong pin". So the download is forced here rather than left to `Build and
      # test`, and the step asserts positively that it happened: `Downloading
      # https://services.gradle.org/…` is printed by the wrapper only on the path that also calls
      # verifyDownloadChecksum. Confirmed both ways locally — a fresh GRADLE_USER_HOME prints that
      # line once, a warm one prints it zero times. It costs nothing extra: this is the same single
      # download `Build and test` would otherwise do, moved one step earlier so its absence is
      # visible.
      - name: Make the distribution checksum load-bearing
        run: |
          set -eu
          dists="${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists"
          rm -rf "$dists"
          log="$RUNNER_TEMP/wrapper-fetch.log"
          if ! ./gradlew --version > "$log" 2>&1; then
            cat "$log"
            echo "::error::The wrapper failed before the build started; see the log above."
            exit 1
          fi
          if ! grep -q '^Downloading https://services\.gradle\.org/' "$log"; then
            cat "$log"
            echo "::error::The wrapper did not download the distribution, so" \
                 "distributionSha256Sum was not evaluated on this run. Deleting $dists no longer" \
                 "forces the download path — find where setup-gradle now puts the distribution."
            exit 1
          fi
          grep -e '^Fetching distribution' -e '^Downloading ' "$log"

      # :wm asserts on real compositor behaviour — tree shape, focus memory, what sway does
      # and does not collapse. Headless wlroots needs no GPU, seat, or display, so the runner
      # can host a genuine sway rather than a stub that would only test itself.
      - name: Install sway and foot
        id: install-sway
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway foot

      # The summary script below parses the JUnit XML with a hand-rolled awk program that has to
      # stay mawk-compatible, because mawk is `/usr/bin/awk` here. `summaryMatrixTest` proves
      # that by running its whole case list under every awk it can find, and it refuses to run
      # against fewer than two distinct ones: a portability claim drawn from one implementation
      # is not a portability claim. This runner ships mawk as `awk`, and its `busybox-static`
      # already carries the awk applet, so gawk is the only one that has to be fetched.
      # `busybox` is deliberately *not* installed: apt resolves that package by **removing**
      # `busybox-static` and `ubuntu-standard`, which is a large change to the runner in
      # exchange for an implementation already present.
      #
      # Installing gawk may or may not move the `awk` alternative onto it — that is the packaging
      # system's decision, not this file's, so the step prints what `awk` resolves to rather than
      # asserting it (run 31068645962 says it does move). Nothing depends on the answer: the
      # matrix names `mawk` in its roster and runs the whole case list under it by name, which is
      # *why* it names implementations rather than trusting the alternative to still point where
      # it did last week.
      - name: Install extra awk implementations
        id: install-awks
        run: |
          sudo apt-get install -y --no-install-recommends gawk
          for a in awk mawk gawk "busybox awk"; do
            printf '%s: ' "$a"
            $a 'BEGIN { print "ok" }' || echo "MISSING"
          done
          echo "awk resolves to: $(readlink -f "$(command -v awk)")"

      # :registry shells out to the spanreed CLI, and its suite skips silently without it —
      # the same false-green trap as :wm without sway, in a second module.
      #
      # This used to be `pipx install spanreed-bus`, which resolved to whatever PyPI served that
      # morning and checked nothing about it. The wheel is now named by version *and* verified
      # against a sha256 taken from PyPI's own metadata for that file
      # (`https://pypi.org/pypi/spanreed-bus/json`, `urls[].digests.sha256`) — published by the
      # index, not computed here from the file we were handed, which would certify whatever we
      # were served. `sha256sum -c` exits non-zero on a mismatch and the step dies before the
      # wheel is installed, let alone executed.
      #
      # Two things this deliberately does not do, so nobody reads more into it than is there.
      # The wheel's dependencies (anyio, mcp, pydantic and their closure) are resolved by pip from
      # PyPI with no pin and no hash: hash-pinning them means committing the whole transitive
      # closure and re-deriving it on every bump, which is not proportionate for a package that
      # is the repository owner's own. And a pin freezes the CLI contract :registry tests against
      # — CI no longer picks up a new spanreed the day it ships, so bumping SPANREED_VERSION and
      # SPANREED_SHA256 together is now part of releasing one.
      - name: Install spanreed
        id: install-spanreed
        env:
          SPANREED_VERSION: '0.0.8'
          SPANREED_SHA256: '7ab7c0128235751da1ff466916047df3e94716e11a2e27c5403227de5bae87d1'
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/spanreed-wheel"
          mkdir -p "$wheel_dir"
          python3 -m pip download --no-deps --only-binary :all: \
            "spanreed-bus==${SPANREED_VERSION}" -d "$wheel_dir"
          wheel="$wheel_dir/spanreed_bus-${SPANREED_VERSION}-py3-none-any.whl"
          echo "${SPANREED_SHA256}  ${wheel}" | sha256sum -c -
          pipx install "$wheel" || pip install --user "$wheel"
          spanreed --help > /dev/null

      - name: Build and test
        id: gradle
        env:
          # Turn "the tool is missing" from a silent skip into a failure. A green run that
          # skipped every window-management or registry test reads as coverage that does not
          # exist — which is worse than a red one, because nobody investigates it.
          AWAKENER_REQUIRE_SWAY: '1'
          AWAKENER_REQUIRE_SPANREED: '1'
          # Same rule, third tool. `cli:launcherTest` re-runs a slice of its rows under `dash` and
          # `busybox sh` to make the launcher's `#!/bin/sh` an honest claim, and skipped them
          # silently when either was absent: 45 rows against 53, green both times (#98). Both are
          # on ubuntu-latest — dash as /bin/sh, busybox from busybox-static — so this asserts what
          # is already true and reddens the day it stops being true. Three suites read it now, not
          # one: `summaryMatrixTest` since #138/#154 and `uploadOutcomeMatrixTest` since #156 each
          # re-run their whole harness under the same two shells, for the same reason — a
          # `#!/bin/sh` header nothing exercises renders identically whether it is true or false.
          AWAKENER_REQUIRE_SHELLS: '1'
        run: ./gradlew build --stacktrace

      # A red `build` now means the build is red, but it still does not say *which* phase went
      # red, and "the runner could not be provisioned" is a different thing to read than "a
      # test failed". Name the failing phase in the run summary so that is one click rather
      # than an excavation through the log.
      - name: Name the phase that failed
        if: failure()
        env:
          SWAY: ${{ steps.install-sway.outcome }}
          AWKS: ${{ steps.install-awks.outcome }}
          SPANREED: ${{ steps.install-spanreed.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
        run: |
          {
            echo "### Which phase failed"
            echo
            echo "| phase | outcome |"
            echo "|---|---|"
            echo "| install sway and foot | \`${SWAY:-did-not-run}\` |"
            echo "| install extra awks | \`${AWKS:-did-not-run}\` |"
            echo "| install spanreed | \`${SPANREED:-did-not-run}\` |"
            echo "| build and test | \`${GRADLE:-did-not-run}\` |"
            echo
            if [ "$GRADLE" = "failure" ]; then
              echo "The compile-and-test phase failed. This red is about the code."
            else
              echo "The build never ran. This red is about provisioning the runner; it establishes nothing either way about the tree."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # tests=/skipped=/failures= are the doctrine's control for a run that verified nothing.
      # Put them in the run summary and in the step log, so applying that control needs no
      # download — the summary for a human, the log because that is the one an API can read
      # back, and the reader here is as often an agent as a person. The script says why it
      # reports rather than gates.
      #
      # It also gates, on `.github/scripts/test-floors`: a module that reported fewer tests than
      # the tree says it should have, or none at all, reddens the build here. That is the only
      # control anywhere that compares what ran against what should have run — every other one,
      # including the REQUIRE flags and `skipped="0"`, answers a question about the tests that
      # ran (#97). It runs after `Build and test` deliberately, so it still fires when the Gradle
      # task that holds the same property was the thing that stopped running.
      - name: Summarise test counts
        if: always()
        run: .github/scripts/test-summary.sh

      # Two artifacts rather than one, because the two want different answers to
      # if-no-files-found, and because the XML is kilobytes where the HTML is megabytes — the
      # machine-readable evidence should not cost an HTML download to fetch.
      #
      # Both globs are anchored at <module>/build/… rather than starting with `**/`. A leading
      # `**/` walks the whole tree, which is how a symlink loop left under cli/build/ by a
      # test fixture became an ELOOP and a red build (#57). An anchored prefix descends only
      # into directories that can hold results.
      - name: Upload JUnit XML
        id: upload-xml
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-xml
          path: '*/build/test-results/*/*.xml'
          # warn, not ignore. If the build died before any test ran, an empty artifact is
          # expected and a warning is the right volume — but a path that silently matches
          # nothing is exactly how #65 survived: an artifact named test-results had contained
          # no test results for its whole life and never said so.
          if-no-files-found: warn
          # 90 days is the maximum a public repo may set, and today's default. Naming it pins
          # it, so a change to the repo default cannot silently shorten it. An intermittent
          # needs weeks to accumulate instances — #56 was diagnosable only because two runs'
          # artifacts happened to still exist.
          retention-days: 90

      - name: Upload HTML test report
        id: upload-html
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-report-html
          path: '*/build/reports/tests/**'
          # ignore is right here: the HTML is the convenience copy for reading a stack trace,
          # the XML above is the evidence, and the XML's warn already covers misconfiguration.
          if-no-files-found: ignore
          retention-days: 90

  # The upload steps above carry continue-on-error so they cannot misattribute their own
  # failure to the build. On its own that would make them silent, which #57 rules out — so
  # this job re-raises the same failure under a name that says what actually broke. The
  # failure stays exactly as visible; only the label on it changes.
  #
  # It has to be a separate job to get a separate check name, and the upload itself cannot
  # move here: the files live on the build job's runner, and getting them off it is the very
  # thing being reported on.
  test-artifacts:
    needs: build
    # `!cancelled()` and not `always()`, and the difference is the whole subject of this PR.
    #
    # The upload steps carry `if: always()`, so on a cancelled run they still execute and can
    # still fail — and under `always()` this job would then go **red**. A red check is a
    # positive claim that something went wrong with the artifacts, and a cancelled run is an
    # *absence of evidence*, not a fault. Reporting one as the other is the same defect as
    # #57 and #73, one level down, in the very check meant to fix them. Observed, not
    # theorised: run 30998115901 on #77's branch came back `build: cancelled` +
    # `test-artifacts: failure`.
    #
    # `!cancelled()` still runs the job when `build` fails — which is the case that matters,
    # since a failed build with intact evidence must show green here — and skips it when the
    # run is cancelled, so the check reads "no verdict" rather than asserting one.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The body of this job is a script rather than a `run:` block, and the checkout is what that
      # costs. #99 was found by running the block by hand over thirteen inputs — of which `''`,
      # `skipped` and a typo'd step id all exited 0 — and a check that can only be exercised by
      # pushing to a branch is one nobody exercises. `uploadOutcomeMatrixTest` now runs those
      # inputs on every build, against mutants that put the defect back.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Report whether the test evidence was captured
        env:
          BUILD: ${{ needs.build.result }}
          XML: ${{ needs.build.outputs.xml-upload }}
          HTML: ${{ needs.build.outputs.html-upload }}
        run: .github/scripts/upload-outcome.sh
