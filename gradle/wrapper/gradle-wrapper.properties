distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
# Published by Gradle, not computed from the zip we were served: taken from
# https://services.gradle.org/distributions/gradle-9.5.1-bin.zip.sha256 and corroborated
# against https://gradle.org/release-checksums/ ("Binary-only (-bin) ZIP Checksum" under 9.5.1).
# A sum derived from an already-downloaded file certifies whatever the network handed over and
# pins nothing. Bump this line with any distributionUrl change; the wrapper aborts before
# unpacking when it disagrees. validateDistributionUrl below checks the URL's host, not the bytes.
#
# ⚠️ DELETING THIS LINE IS SILENT. The wrapper rejects a wrong value and a blank one, and accepts
# absence — it downloads, unpacks, runs, and exits 0. `.github/scripts/check-wrapper-pin.sh` is
# what notices, and CI runs it before ./gradlew is invoked. Run it after editing this file.
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
